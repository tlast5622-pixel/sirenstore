      margin: 0 auto;
      padding: 1.25rem;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(15, 23, 42, 0.42);

      -webkit-backdrop-filter: blur(18px);
      border-radius: 2rem;
